[platformio]
default_envs = m5stack_timer_camera_f

[env:m5stack_timer_camera_f]
platform = espressif32
board = m5stack-timer-cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    espressif/esp32-camera@^2.0.4
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=1
    -D VRC_DEVICE_NAME=\"m5stack_timer_camera_f\"
