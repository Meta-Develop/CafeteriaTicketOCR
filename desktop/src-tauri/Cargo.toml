[package]
name = "cafeteria-ticket-ocr"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "x11", "custom-protocol"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.dev]
debug = 0
codegen-units = 1

[profile.release]
codegen-units = 1
strip = true
